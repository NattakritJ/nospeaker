name: macOS haptic music checks

on:
  push:
    branches:
      - main
      - feat/audio-haptics-player
  pull_request:

jobs:
  build-and-analyze:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile Apple Silicon and Intel targets
        run: sh ./build.sh
      - name: Validate synthetic audio via FFT without a trackpad
        run: sh ./tests/music-smoke.sh
